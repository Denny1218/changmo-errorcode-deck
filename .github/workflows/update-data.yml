# 매일 새벽 3시(한국 시간)에 업데이트 게시판을 읽어서, 새 공지가 있으면 data.js 를 갱신해 올림.
# GitHub 저장소의 Actions 탭 → "공지 데이터 갱신" → Run workflow 로 바로 돌릴 수도 있음.
name: 공지 데이터 갱신

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 공지 읽어서 data.js 만들기
        shell: powershell
        run: .\update-data.ps1

      - name: 바뀌었으면 올리기
        shell: bash
        run: |
          if git diff --quiet -- data.js; then
            echo "새 공지 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "공지 데이터 자동 갱신"
          git push
